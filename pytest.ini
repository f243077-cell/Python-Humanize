[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers --tb=short -p no:cacheprovider
# Parallel: add  -n auto --dist loadscope  (see run_tests.sh)
markers =
    smoke: fastest sanity checks - always run FIRST
    ecp: Equivalence Class Partitioning cases
    bva: Boundary Value Analysis cases
    negative: invalid / error-handling inputs
    datadriven: cases that read their data from the CSV files in data/
    regression: full regression suite (everything)
    number: tests for humanize.number
    filesize: tests for humanize.filesize
    time: tests for humanize.time
    run_order(n): explicit order inside a group (lower runs first, default 100)
