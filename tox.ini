[tox]
envlist = py311, py312, py313, parallel
skipsdist = true

[testenv]
description = full suite, serial (ordered)
deps = -r requirements-test.txt
commands = python -m pytest {posargs}

[testenv:parallel]
description = full suite, parallel with xdist (per-module order kept)
commands = python -m pytest -n auto --dist loadscope {posargs}

[testenv:report]
description = HTML + JUnit + coverage reports
commands = python -m pytest --html=report.html --self-contained-html --junitxml=junit.xml --cov=humanize --cov-report=term-missing --cov-report=html {posargs}
